<header>

<main>

    <label for="fAmt">How much?</label>
    <input id="fAmt" type="number" step="0.01" min="0" inputmode="decimal" placeholder="15.00">
    <label for="fDate">When does it charge?</label>
    <input id="fDate" type="date">
    <label for="fRepeat">How often?</label>
    <select id="fRepeat">
      <option value="none">Just this once</option>
      <option value="monthly">Every month</option>
      <option value="biweekly">Every 2 weeks (payday)</option>
      <option value="yearly">Every year</option>
    </select>
    <label for="fSteps">How do I cancel it? (the taps)</label>
    <textarea id="fSteps" placeholder="The steps to cancel, so future-you doesn't have to hunt for them. Start typing a known name above and I'll fill this in when I know it."></textarea>
    <label for="fNote">Anything to remember? (optional)</label>
    <input id="fNote" type="text" placeholder="Like: only cancel after my EIN lands" autocomplete="off">
    <div class="rowbtns">
      <button type="submit" id="saveBtn">Save it</button>
      <button type="button" class="plain" id="cancelBtn">Never mind</button>
    </div>
    <p class="hint">No bank login. No connecting accounts. It only knows what you type here.</p>

}

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        /* Older lists (from the first version) have no price memory yet — give them one. */
        arr.forEach(function(it){
          if (!Array.isArray(it.history) || !it.history.length) {
            it.history = [{ amount: Number(it.amount) || 0, since: todayStr() }];
          }
        });
        /* Seed rounds (2026-11-15): new built-in charges join lists saved by older
           versions — each round lands once only, so anything she takes off stays off. */
        var sv = 0;
        try { sv = parseInt(localStorage.getItem(KEY + ".seedsV") || "0", 10) || 0; } catch(e){}
        if (localStorage.getItem(KEY + ".seedsV2")) sv = Math.max(sv, 2);
        if (sv < 8) {
          seedItems().forEach(function(s){
            if (!arr.some(function(x){ return x.id === s.id; })) arr.push(s);
          });
          /* Round 4 also fixes the four domain prices: the seeds first carried $11.08,
             but her bank shows $11.81 — correct only copies still holding the wrong seed value. */
          ["seed-whatdimake-domain", "seed-buddy-domain", "seed-gift-domain", "seed-pet-domain"].forEach(function(id){
            arr.forEach(function(x){
              if (x.id === id && Number(x.amount) === 11.08) {
                x.amount = 11.81;
                if (Array.isArray(x.history) && x.history.length) x.history[0].amount = 11.81;
              }
            });
          });
          /* Round 7 fixes the band payment: the seed guessed $50 on Dec 8 from a calendar
             note, but her bank shows AMRO MUSIC $49.94 on Oct 9 — correct only a copy
             still holding the exact guessed values. */
          arr.forEach(function(x){
            if (x.id === "seed-band" && Number(x.amount) === 50 && x.date === "2026-12-08") {
              x.name = "Jacob's Band Payment (AMRO Music)";
              x.amount = 49.94;
              x.date = "2026-12-09";
              x.note = "On autopay. Shows on your bank as AMRO MUSIC \u2014 $49.94 on Oct 9.";
              if (Array.isArray(x.history) && x.history.length) x.history[0].amount = 49.94;
            }
          });
          /* Round 8 puts the exact car payment in the note: $392.35 (Mary confirmed),
             so their pay fee is $13.60 of the $405.95 that leaves her account. */
          arr.forEach(function(x){
            if (x.id === "seed-carpayment" && x.note && x.note.indexOf("about $396") !== -1) {

            }
          });
          try { localStorage.setItem(KEY + ".seedsV", "8"); save(arr); } catch(e){}
        }
        return arr;
      }
    }
  } catch(e){}
  var s = seedItems();
  save(s);
  try { localStorage.setItem(KEY + ".seedsV", "8"); } catch(e){}
  return s;
}
function save(items){
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){}
}

/* ---- Date helpers (plain calendar math, in her timezone as the phone reports it) ---- */
function todayStr(){
  var d = new Date();
  var m = "" + (d.getMonth() + 1), day = "" + d.getDate();
  if (m.length < 2) m = "0" + m;
  if (day.length < 2) day = "0" + day;
  return d.getFullYear() + "-" + m + "-" + day;
}
function daysUntil(dateStr){
  var a = new Date(todayStr() + "T00:00:00");
  var b = new Date(dateStr + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function prettyDate(dateStr){
  var d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
function money(n){ return "$" + Number(n).toFixed(2); }
function rollForward(dateStr, repeat){
  var d = new Date(dateStr + "T00:00:00");
  if (repeat === "monthly") d.setMonth(d.getMonth() + 1);
  else if (repeat === "biweekly") d.setDate(d.getDate() + 14);
  else if (repeat === "yearly") d.setFullYear(d.getFullYear() + 1);
  else return dateStr;
  var m = "" + (d.getMonth() + 1), day = "" + d.getDate();
  if (m.length < 2) m = "0" + m;
  if (day.length < 2) day = "0" + day;
  return d.getFullYear() + "-" + m + "-" + day;
}
function daysWord(n){
  if (n < 0) return Math.abs(n) + (Math.abs(n) === 1 ? " day late" : " days late");
  if (n === 0) return "charges TODAY";
  if (n === 1) return "charges tomorrow";
  return "in " + n + " days";
}

  var active = items.filter(function(i){ return i.status === "active"; });
  active.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  var done = items.filter(function(i){ return i.status !== "active"; });

  if (active.length === 0){
    nextEl.innerHTML = '<div class="label">Coming up</div><div class="big">Nothing watching right now</div>' +
      '<div class="sub">Add a trial or subscription above and it will sit here, watching its date.</div>';
  } else {
    var first = active[0];
    var total30 = 0;
    active.forEach(function(i){ if (daysUntil(i.date) <= 30) total30 += Number(i.amount); });
    nextEl.innerHTML = '<div class="label">Next charge</div>' +
      '<div class="big">' + esc(first.name) + " \u2014 " + money(first.amount) + "</div>" +
      '<div class="sub">' + prettyDate(first.date) + " \u00B7 " + daysWord(daysUntil(first.date)) +
      (total30 > 0 ? " \u00B7 " + money(total30) + " coming up in the next 30 days" : "") + "</div>";
  }

  if (active.length === 0){
    listEl.innerHTML = '<div class="empty">Your list is empty. Tap the gold button up top to add the first one.</div>';
  } else {
    listEl.innerHTML = active.map(itemHtml).join("");
  }

  if (done.length){
    doneEl.innerHTML = "<h2>Finished \u2014 cancelled or handled</h2>" + done.map(itemHtml).join("");
  } else {
    doneEl.innerHTML = "";
  }
  wireButtons();
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function itemHtml(i){
  var n = daysUntil(i.date);
  var pillCls = i.status !== "active" ? "far" : (n <= 1 ? "now" : (n <= 7 ? "" : "far"));
  var dparts = i.date.split("-");
  var dobj = new Date(i.date + "T00:00:00");
  var moShort = dobj.toLocaleDateString("en-US", { month: "short" });
  var html = '<div class="item' + (i.status !== "active" ? " done" : "") + '">';
  html += '<div class="tear"></div><div class="body">';
  html += '<div class="top"><div class="dateblock"><div class="mo">' + moShort + '</div><div class="dy">' +
    Number(dparts[2]) + '</div></div><div class="name">' + esc(i.name) + '</div><div class="amt">' + money(i.amount) + "</div></div>";
  if (i.status === "active"){
    html += '<span class="pill ' + pillCls + '">' + daysWord(n) + "</span>";
    html += '<div class="when">' + prettyDate(i.date) +
      (i.repeat === "monthly" ? " \u00B7 every month" : (i.repeat === "biweekly" ? " \u00B7 every 2 weeks" : (i.repeat === "yearly" ? " \u00B7 every year" : " \u00B7 one time"))) + "</div>";
  } else {
    html += '<div class="when">Was due ' + prettyDate(i.date) + "</div>";
  }
  if (Array.isArray(i.history) && i.history.length > 1) {
    var firstAmt = Number(i.history[0].amount), curAmt = Number(i.amount);
    var diff = Math.round((curAmt - firstAmt) * 100) / 100;
    if (diff !== 0) {
      html += '<div class="pricehist">' +
        (diff > 0 ? "\uD83D\uDCC8 Price went UP " + money(diff) : "\uD83D\uDCC9 Price went DOWN " + money(Math.abs(diff))) +
        " \u2014 it was " + money(firstAmt) + " when you added it.</div>";
    }
  }
  if (i.note) html += '<div class="note">' + esc(i.note) + "</div>";
  if (i.steps) html += "<details><summary>How to cancel it</summary><div class=\"steps\">" + esc(i.steps) + "</div></details>";
  if (i.status === "active"){
    var lk = linkFor(i.name);
    if (lk) html += '<a class="btnlink" href="' + lk.url + '" target="_blank" rel="noopener">' + esc(lk.label) + " \u2192</a>";
  }
  html += '<div class="actions">';
  if (i.status === "active"){
    html += '<button class="small" data-act="cancelled" data-id="' + i.id + '">I cancelled it</button>';
    html += '<button class="small plain" data-act="kept" data-id="' + i.id + '">' +
      (i.repeat === "none" ? "I paid it / handled it" : "I'm keeping it") + "</button>";
    html += '<button class="small plain" data-act="edit" data-id="' + i.id + '">Fix it</button>';
    html += '<button class="small danger" data-act="del" data-id="' + i.id + '">Take it off</button>';
  } else {
    html += '<button class="small plain" data-act="back" data-id="' + i.id + '">Put it back</button>';
    html += '<button class="small danger" data-act="del" data-id="' + i.id + '">Take it off</button>';
  }
  html += "</div></div></div>";
  return html;
}
function wireButtons(){
  var btns = document.querySelectorAll("[data-act]");
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-id"), act = b.getAttribute("data-act");
      var it = null;
      items.forEach(function(x){ if (x.id === id) it = x; });
      if (!it) return;
      if (act === "cancelled"){ it.status = "cancelled"; }
      else if (act === "kept"){
        if (it.repeat === "none"){ it.status = "handled"; }
        else {
          it.date = rollForward(it.date, it.repeat);
          while (daysUntil(it.date) < 0) it.date = rollForward(it.date, it.repeat);
        }
      }
      else if (act === "back"){ it.status = "active"; }
      else if (act === "del"){
        if (window.confirm("Take " + it.name + " off the list for good?")) {
          items = items.filter(function(x){ return x.id !== id; });
        } else return;
      }
      else if (act === "edit"){ openForm(it); return; }
      save(items);
      render();
    });
  });
}

/* ---- Add / edit form ---- */
var form = document.getElementById("addForm");
var addBtn = document.getElementById("addBtn");
var fId = document.getElementById("fId"), fName = document.getElementById("fName"),
    fAmt = document.getElementById("fAmt"), fDate = document.getElementById("fDate"),
    fRepeat = document.getElementById("fRepeat"), fSteps = document.getElementById("fSteps"),
    fNote = document.getElementById("fNote");

function openForm(it){
  form.hidden = false;
  if (it){
    fId.value = it.id; fName.value = it.name; fAmt.value = it.amount;
    fDate.value = it.date; fRepeat.value = it.repeat; fSteps.value = it.steps || "";
    fNote.value = it.note || "";
    document.getElementById("saveBtn").textContent = "Save the fix";
  } else {
    fId.value = ""; fName.value = ""; fAmt.value = ""; fDate.value = "";
    fRepeat.value = "none"; fSteps.value = ""; fNote.value = "";
    document.getElementById("saveBtn").textContent = "Save it";
  }
  form.scrollIntoView({ behavior: "smooth", block: "start" });
  fName.focus();
}
addBtn.addEventListener("click", function(){ openForm(null); });
document.getElementById("cancelBtn").addEventListener("click", function(){ form.hidden = true; });

var stepsTouched = false;
fSteps.addEventListener("input", function(){ stepsTouched = true; });
fName.addEventListener("blur", function(){
  if (!stepsTouched || !fSteps.value){
    var s = stepsFor(fName.value);
    if (s) fSteps.value = s;
  }
});

form.addEventListener("submit", function(ev){
  ev.preventDefault();
  var name = fName.value.trim();
  var amt = parseFloat(fAmt.value);
  var date = fDate.value;
  if (!name){ window.alert("Give it a name first \u2014 what is it?"); fName.focus(); return; }
  if (isNaN(amt) || amt < 0){ window.alert("How much does it charge? Put the amount in."); fAmt.focus(); return; }
  if (!date){ window.alert("When does it charge? Pick the date."); fDate.focus(); return; }
  var rec = { name: name, amount: Math.round(amt * 100) / 100, date: date,
              repeat: fRepeat.value, steps: fSteps.value.trim(), note: fNote.value.trim(),
              status: "active" };
  if (fId.value){
    items.forEach(function(x){
      if (x.id === fId.value){
        if (!Array.isArray(x.history) || !x.history.length) {
          x.history = [{ amount: Number(x.amount) || 0, since: todayStr() }];
        }
        if (Number(x.amount) !== rec.amount) {
          x.history.push({ amount: rec.amount, since: todayStr() });
        }
        x.name = rec.name; x.amount = rec.amount; x.date = rec.date;
        x.repeat = rec.repeat; x.steps = rec.steps; x.note = rec.note; x.status = "active";
      }
    });
  } else {
    rec.id = "it" + Date.now();
    rec.history = [{ amount: rec.amount, since: todayStr() }];
    items.push(rec);
  }
  stepsTouched = false;
  save(items);
  form.hidden = true;
  render();
});

render();
</script>
</body>
</html>
